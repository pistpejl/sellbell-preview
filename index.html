            * { box-sizing: border-box; }
            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }
            .hidden { display: none !important; }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                font-family: "Nunito", system-ui, -apple-system, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background: linear-gradient(165deg, #4FB8FF 0%, #7B8CFF 42%, #9B6BFF 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 16px 40px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
                padding: 0;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                width: 100%;
                margin: 0 auto;
                padding: 28px 22px 26px;
                text-align: center;
                border-radius: 28px;
                box-shadow: 0 24px 60px rgba(74, 31, 140, 0.28), 0 2px 8px rgba(0,0,0,0.06);
            }

            .sb-logo {
                width: 72px;
                height: 72px;
                border-radius: 18px;
                margin: 0 auto 12px;
                display: block;
                box-shadow: 0 10px 24px rgba(155, 107, 255, 0.35);
            }
            .sb-wordmark {
                height: 36px;
                width: auto;
                max-width: 200px;
                margin: 0 auto 10px;
                display: block;
            }
            .sb-slogan {
                font-weight: 800;
                font-size: 14px;
                color: #4A1F8C;
                margin: 0 0 18px;
                letter-spacing: 0.01em;
            }

            .staticrypt-instructions { margin: 0 0 8px; }
            .staticrypt-title {
                font-size: 1.15rem;
                font-weight: 800;
                color: #4A1F8C;
                margin: 0 0 4px;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                color: #5b4a7a;
                font-size: 14px;
                margin: 0 0 12px;
                font-weight: 600;
            }
            .staticrypt-hr { display: none; }

            .staticrypt-password-container {
                position: relative;
                background: #F5F1FF;
                width: 100%;
                border: 2px solid #ECE4FF;
                border-radius: 999px;
                margin: 0 0 14px;
                overflow: hidden;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }
            .staticrypt-password-container:focus-within {
                border-color: #9B6BFF;
                box-shadow: 0 0 0 4px rgba(155,107,255,0.18);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-family: inherit;
                font-size: 16px;
                font-weight: 600;
                color: #4A1F8C;
                outline: 0;
                padding: 15px 48px 15px 18px;
                width: 100%;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 55%;
                padding: 13px;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                outline: 0;
                background: #9B6BFF;
                background-image: linear-gradient(135deg, #4FB8FF, #9B6BFF);
                width: 100%;
                border: 0;
                padding: 15px 18px;
                color: #ffffff;
                font-family: inherit;
                font-size: 16px;
                font-weight: 800;
                cursor: pointer;
                border-radius: 999px;
                box-shadow: 0 12px 28px rgba(155,107,255,0.35);
                transition: transform 0.12s ease, filter 0.12s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(1.05);
                transform: translateY(-1px);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin: 0 0 16px;
                color: #5b4a7a;
                font-size: 13px;
                font-weight: 700;
                cursor: pointer;
                user-select: none;
            }
            .staticrypt-remember input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 20px;
                height: 20px;
                margin: 0;
                border-radius: 6px;
                border: 2px solid #9B6BFF;
                background: #fff;
                display: grid;
                place-content: center;
                flex-shrink: 0;
            }
            .staticrypt-remember input[type="checkbox"]::before {
                content: "";
                width: 10px;
                height: 10px;
                transform: scale(0);
                transition: transform 0.12s ease;
                border-radius: 3px;
                background: linear-gradient(135deg, #4FB8FF, #9B6BFF);
            }
            .staticrypt-remember input[type="checkbox"]:checked::before {
                transform: scale(1);
            }

            .sb-error {
                display: none;
                margin: 0 0 12px;
                padding: 10px 12px;
                border-radius: 14px;
                background: #FFE8E8;
                color: #B42318;
                font-size: 13px;
                font-weight: 700;
            }
            .sb-error.visible { display: block; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(165deg, #4FB8FF 0%, #9B6BFF 100%);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid rgba(255,255,255,0.55);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media (min-width: 480px) {
                .staticrypt-form { padding: 36px 32px 30px; }
                .sb-logo { width: 84px; height: 84px; border-radius: 22px; }
            }
        </style>
    </head>
